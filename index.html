<script>
const videoIds = [
    '7123456789012345678' 
];

// Проверяем наличие элемента ДО начала работы
const gallery = document.getElementById('tiktok-gallery');
if (!gallery) {
    console.error("Критическая ошибка: Элемент #tiktok-gallery не найден в HTML!");
}

async function loadVideo(id) {
    const card = document.querySelector(`.video-card[data-id="${id}"]`);
    if (!card) return;

    // Находим лоадер внутри конкретной карточки
    const loader = card.querySelector('.loader');
    if (loader) loader.style.display = 'block';

    try {
        // Добавляем параметр mode: no-cors ТОЛЬКО ДЛЯ ЛОГИРОВАНИЯ, если нужно увидеть сетевой статус
        const response = await fetch(`https://www.tiktok.com/oembed?url=https://www.tiktok.com/@tiktok/video/${id}`, {cache: "no-cache"});
        
        console.log("Статус ответа от TikTok:", response.status); // Смотрим это в Console (F12)

        if (response.status === 404) {
            throw new Error("Видео не найдено (удалено или приватно)");
        }
        if (response.status === 429) {
            throw new Error("Слишком много запросов. Вы открывали страницу слишком часто.");
        }
        if (!response.ok) {
            throw new Error(`HTTP Ошибка: ${response.status}`);
        }

        const data = await response.json();

        // Прямая проверка того, что пришло в JSON
        if (!data.html || !data.thumbnail_url) {
            console.error("Ответ пришел, но данных нет:", data);
            throw new Error("TikTok прислал пустой ответ");
        }

        // Убираем заглушки
        const placeholderImg = card.querySelector('.placeholder-img');
        const playBtn = card.querySelector('.play-button');
        if (placeholderImg) placeholderImg.remove();
        if (playBtn) playBtn.remove();
        if (loader) loader.style.display = 'none';

        const container = document.createElement('div');
        container.innerHTML = data.html;
        card.appendChild(container);

        if (window.tiktokCreateWidgets) {
            window.tiktokCreateWidgets();
        }

    } catch (error) {
        console.error("Ошибка при загрузке ID", id, "->", error.message);
        if (loader) {
            loader.textContent = 'Не удалось загрузить :( Проверьте консоль (F12)';
            loader.style.color = '#ff6b6b';
            loader.style.fontWeight = 'bold';
        }
    }
}

function createCard(videoId) {
    if (!gallery) return;
    
    const card = document.createElement('div');
    card.className = 'video-card';
    card.dataset.id = videoId;

    const loader = document.createElement('div');
    loader.className = 'loader';
    loader.textContent = 'Нажмите для загрузки';
    card.appendChild(loader);

    // Сразу создаем картинку-заставку, чтобы пользователь видел превью
    const img = document.createElement('img');
    img.src = `https://p16-sign-va.tiktokcdn.com/obj/tos-maliva-p-0037/cover/${videoId.slice(-10)}_cover.jpg?q=75&t=bill&u=a%3A1`;
    img.onerror = function() { img.style.display = 'none'; }; // Скрываем битую картинку
    img.className = 'placeholder-img';
    card.prepend(img);

    const button = document.createElement('button');
    button.className = 'play-button';
    button.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    card.appendChild(button);

    gallery.appendChild(card);

    card.addEventListener('click', () => loadVideo(videoId));
}

videoIds.forEach(createCard);
</script>
